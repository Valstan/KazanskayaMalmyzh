name: KARMAN grant probe

# Ручной инструмент двустороннего маршрута grant'ов
# (письма brain 03.09, 02.10, 05.10, 09.10; мандат: принять grant id=16).
#
# Только workflow_dispatch: сессия КАРМАНа открывается OIDC-удостоверением
# прогона, а subject_pattern КАРМАНа пропускает только refs/heads/main —
# запускать строго с main (на PR-прогоне будет 401 по построению).
#
# Прод не трогает по построению: SSH, env-файла юнита и рестарта здесь нет.
# Значения секретов в лог не попадают никогда (ADR-0006): печатаются только
# имена полей, типы значений и коды ответов. Состояния grant'ов
# (pending/accepted/...) — метаданные маршрута, не секреты: их печатать
# можно и нужно, иначе accept не подтвердить.

on:
  workflow_dispatch:
    inputs:
      grant_id:
        description: "id grant'а для accept (по умолчанию 16 — ESA_CLIENT_SECRET_KAZANSKAYA от setka)"
        required: true
        default: "16"
        type: string
      secret_key:
        description: "Имя секрета, наличие которого проверяем после accept (значение НЕ читаем и не печатаем)"
        required: true
        default: "ESA_CLIENT_SECRET_KAZANSKAYA"
        type: string

permissions:
  contents: read
  # Паспортный путь ADR-0012 (D-061): без этого права ACTIONS_ID_TOKEN_REQUEST_*
  # в шаге не появятся вовсе.
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Passport → session → accept grant (brain 09.10, точный вызов)"
        env:
          VAULT: ${{ secrets.SECRETS_VAULT_URL }}
          GRANT_ID: ${{ inputs.grant_id }}
          SECRET_KEY: ${{ inputs.secret_key }}
        run: |
          set -euo pipefail

          if [ -z "${VAULT:-}" ]; then
            echo "::warning::secrets.SECRETS_VAULT_URL не задан — accept пропущен"
            exit 0
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::warning::OIDC недоступен (нужно permissions: id-token: write) — accept пропущен"
            exit 0
          fi
          case "$GRANT_ID" in
            "" | *[!0-9]*) echo "::error::grant_id должен быть числом, получено: [$GRANT_ID]"; exit 1 ;;
          esac

          # 1. Удостоверение прогона. audience — РОВНО эта строка, иначе 401 без пояснений.
          ASSERTION="$(curl -sf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=karman-vault" | jq -r '.value // empty')"
          if [ -z "$ASSERTION" ]; then
            echo "::warning::удостоверение прогона не выдано — accept пропущен"
            exit 0
          fi
          echo "::add-mask::$ASSERTION"

          # 2. Сессия комнаты (TTL 60 мин). trap … EXIT ровно ОДИН на шаг:
          #    самоотзыв сессии + удаление временных файлов.
          SESSION="$(curl -sf -X POST "$VAULT/session" -H "Authorization: Bearer $ASSERTION" || true)"
          TOKEN="$(printf '%s' "$SESSION" | jq -r '.token // empty' 2>/dev/null || true)"
          if [ -z "$TOKEN" ]; then
            echo "::warning::сессия не открыта (вне main это 401 по построению) — accept пропущен"
            exit 0
          fi
          echo "::add-mask::$TOKEN"
          trap 'curl -sf -X DELETE "$VAULT/session" -H "Authorization: Bearer $TOKEN" >/dev/null 2>&1 || true; rm -f /tmp/vault-pending.json /tmp/vault-accept.json /tmp/vault-secret.json /tmp/vault-secret-path.json /tmp/vault-room.json' EXIT
          echo "сессия открыта: 201"

          # 3. Где лежит нужный pending: в .received (нам выданные). Печатаем
          #    только идентификаторы и состояние — не значения.
          PCODE="$(curl -s -o /tmp/vault-pending.json -w '%{http_code}' "$VAULT/grants?pending=1" -H "Authorization: Bearer $TOKEN" || true)"
          echo "GET /grants?pending=1: $PCODE"
          if [ "$PCODE" = "200" ]; then
            jq --argjson id "$GRANT_ID" '[({issued: (.issued // []), received: (.received // [])} | to_entries | [.[] | .key as $side | .value[] | {side: $side, id: .id, from: .sourceSlug, to: .targetSlug, key_name: .sourceKey, created: .createdAt, state: ([to_entries[] | select(.key | test("^state$"; "i")) | .value])}]) | .[] | select(.id == $id)]' /tmp/vault-pending.json
          else
            echo "::warning::список pending недочитен (код $PCODE) — accept всё равно пробуем, решит код ответа"
          fi

          # 4. Accept. Тело НЕ отправляем (brain 09.10): успех — 200, повтор — 409.
          #    Повтор — не сбой: accept идемпотентен по построению пути.
          ACODE="$(curl -s -o /tmp/vault-accept.json -w '%{http_code}' -X POST "$VAULT/grants/$GRANT_ID/accept" -H "Authorization: Bearer $TOKEN" || true)"
          echo "POST /grants/$GRANT_ID/accept: $ACODE"
          case "$ACODE" in
            200)
              echo "accept: принят"
              jq '{ok: (.ok // null), type: type, keys: (if type == "object" then keys else null end)}' /tmp/vault-accept.json
              ;;
            409)
              echo "accept: 409 — уже был принят ранее, это не сбой"
              ;;
            *)
              echo "::error::accept вернул $ACODE — дальше не идём"
              exit 1
              ;;
          esac

          # 5. Наличие секрета в комнате после accept. Значение НЕ читаем и НЕ
          #    печатаем (ADR-0006): только имена ключей и коды ответов.
          #    Форма чтения значения не установлена: письмо brain 09.10 даёт
          #    GET /secrets?key=..., живой КАРМАН ответил на неё 404 (прогон
          #    37953435657 — accept при этом прошёл 200). Пробуем обе известные
          #    формы и печатаем коды; наличие доказываем по именам в корне
          #    комнаты (та же форма, что в пробе).
          QCODE="$(curl -s -o /tmp/vault-secret.json -w '%{http_code}' "$VAULT/secrets?key=$SECRET_KEY" -H "Authorization: Bearer $TOKEN" || true)"
          echo "GET /secrets?key=$SECRET_KEY (форма письма brain 09.10): $QCODE"
          FCODE="$(curl -s -o /tmp/vault-secret-path.json -w '%{http_code}' "$VAULT/secrets/$SECRET_KEY" -H "Authorization: Bearer $TOKEN" || true)"
          echo "GET /secrets/$SECRET_KEY (форма с путём): $FCODE"
          if [ "$FCODE" = "200" ]; then
            jq --arg k "$SECRET_KEY" '{type: type, keys: (if type == "object" then keys else null end), key_present: ([.. | objects | has($k)] | any)}' /tmp/vault-secret-path.json
          fi

          RCODE="$(curl -s -o /tmp/vault-room.json -w '%{http_code}' "$VAULT" -H "Authorization: Bearer $TOKEN" || true)"
          echo "GET room root: $RCODE"
          if [ "$RCODE" != "200" ]; then
            echo "::error::корень комнаты недочитен (код $RCODE)"
            exit 1
          fi
          jq --arg k "$SECRET_KEY" '{secret_names: (if (.secrets // null) | type == "object" then (.secrets | keys) else {secrets_type: ((.secrets // null) | type)} end), key_present: (if (.secrets // null) | type == "object" then (.secrets | has($k)) else false end)}' /tmp/vault-room.json
          if ! jq -e --arg k "$SECRET_KEY" '(.secrets // {}) | has($k)' /tmp/vault-room.json >/dev/null; then
            echo "::error::секрет $SECRET_KEY не появился в комнате после accept"
            exit 1
          fi
          echo "секрет $SECRET_KEY в комнате: присутствует (значение не читали)"

      - name: Passport → session → field-names probe
        env:
          VAULT: ${{ secrets.SECRETS_VAULT_URL }}
        run: |
          set -euo pipefail

          if [ -z "${VAULT:-}" ]; then
            echo "::warning::secrets.SECRETS_VAULT_URL не задан — проба пропущена"
            exit 0
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::warning::OIDC недоступен (нужно permissions: id-token: write) — проба пропущена"
            exit 0
          fi

          # 1. Удостоверение прогона. audience — РОВНО эта строка, иначе 401 без пояснений.
          ASSERTION="$(curl -sf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=karman-vault" | jq -r '.value // empty')"
          if [ -z "$ASSERTION" ]; then
            echo "::warning::удостоверение прогона не выдано — проба пропущена"
            exit 0
          fi
          echo "::add-mask::$ASSERTION"

          # 2. Обмен удостоверения на сессионный токен комнаты (TTL 60 мин).
          #    ⚠️ trap … EXIT ровно ОДИН: второй молча заменил бы первый
          #    и самоотзыв сессии исчез бы.
          SESSION="$(curl -sf -X POST "$VAULT/session" -H "Authorization: Bearer $ASSERTION" || true)"
          TOKEN="$(printf '%s' "$SESSION" | jq -r '.token // empty' 2>/dev/null || true)"
          if [ -z "$TOKEN" ]; then
            echo "::warning::сессия не открыта (вне main это 401 по построению) — проба пропущена"
            exit 0
          fi
          echo "::add-mask::$TOKEN"
          trap 'curl -sf -X DELETE "$VAULT/session" -H "Authorization: Bearer $TOKEN" >/dev/null 2>&1 || true; rm -f /tmp/vault-grants.json /tmp/vault-root.json /tmp/vault-openapi.json' EXIT
          echo "сессия открыта: 201"

          # 3. GET /grants: тело — в файл, в лог — ТОЛЬКО имена полей и типы.
          #    Сырое тело не печатаем никогда: в нём могут лежать значения.
          #    Форма ответа (прогон 37626890484): объект {issued, received, slug} —
          #    массивы лежат в .issued (нами выданные) и .received (нам выданные),
          #    а не в .grants/.items/.data, как ждал фильтр деплоя. Поэтому он
          #    ни разу не сработал, и всю работу держал 409 от КАРМАНА.
          GCODE="$(curl -s -o /tmp/vault-grants.json -w '%{http_code}' "$VAULT/grants" -H "Authorization: Bearer $TOKEN" || true)"
          echo "GET /grants: $GCODE"
          if [ "$GCODE" = "200" ]; then
            echo "--- top-level ---"
            jq '{type: type, keys: (if type == "object" then keys else null end)}' /tmp/vault-grants.json
            echo "--- issued: field names + value types (no values) ---"
            jq '{count: (.issued | length), items: ([.issued[] | {keys: keys, types: ([to_entries[] | {key: .key, type: (.value | type)}])}])}' /tmp/vault-grants.json
            echo "--- received: field names + value types (no values) ---"
            jq '{count: (.received | length), items: ([.received[] | {keys: keys, types: ([to_entries[] | {key: .key, type: (.value | type)}])}])}' /tmp/vault-grants.json
            echo "--- route metadata: side + id + identifiers + state (no secret values) ---"
            jq '({issued: (.issued // []), received: (.received // [])} | to_entries | [.[] | .key as $side | .value[] | . as $g | {side: $side, id: ($g.id // null), from: ($g.sourceSlug // null), to: ($g.targetSlug // null), key_name: ($g.sourceKey // null), alias: ($g.aliasKey // null), note: ($g.note // null), shadowed: ($g.shadowed // null), created: ($g.createdAt // null), state: ([$g | to_entries[] | select(.key | test("^state$"; "i")) | .value])}])' /tmp/vault-grants.json
            echo "--- room slug ---"
            jq -r '{slug: .slug}' /tmp/vault-grants.json
            echo "--- entry id=16: field names only ---"
            jq '[(.issued // []) + (.received // []) | .[] | select(.id == 16 or .id == "16") | {keys: keys}]' /tmp/vault-grants.json
          fi

          # 4. GET корня комнаты: код + имена полей. Read-only на своей комнате.
          #    Форма (прогон 37626890484): объект {secrets}. Печатаем только
          #    ИМЕНА ключей — пришедший grant виден как имя, значение не читаем.
          RCODE="$(curl -s -o /tmp/vault-root.json -w '%{http_code}' "$VAULT" -H "Authorization: Bearer $TOKEN" || true)"
          echo "GET room root: $RCODE"
          if [ "$RCODE" = "200" ]; then
            echo "--- room root: secret names only (no values) ---"
            jq '{type: type, keys: (if type == "object" then keys else null end), secret_names: (if (.secrets // null) | type == "object" then (.secrets | keys) else {secrets_type: ((.secrets // null) | type)} end)}' /tmp/vault-root.json
          fi

          # 5. Discovery контракта read-only: стандартный путь OpenAPI-схемы.
          #    Схема — не секреты: печатаем только пути и методы. Если схемы нет
          #    (не 200) — это тоже ответ: точный вызов accept спросим у brain
          #    письмом, а не угадаем в коде.
          OCODE="$(curl -s -o /tmp/vault-openapi.json -w '%{http_code}' "$VAULT/openapi.json" -H "Authorization: Bearer $TOKEN" || true)"
          echo "GET /openapi.json: $OCODE"
          if [ "$OCODE" = "200" ]; then
            echo "--- openapi: paths + methods only ---"
            jq '{paths: (.paths | keys), methods: (.paths | to_entries | map({path: .key, methods: (.value | keys)}))}' /tmp/vault-openapi.json
          fi
