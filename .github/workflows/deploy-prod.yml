name: Deploy to production

# Сборка едет в CI (ubuntu): прод-бокс swapless и не тянет next build (G20).
# На сервер по SSH кладём standalone-артефакт и рестартим systemd-сервис
# kazanskaya. Харвест deploy-prod.yml Сабантуя (ADR-0007).
#
# Репозиторий и логи прогонов публичны (D-038, #223): всё, что описывает бокс,
# живёт в secrets — раннер маскирует только их, значения vars печатаются в лог
# раскрытыми (в том числе в блоке env: шага).
#
# Требуется:
#   secrets.SSH_PRIVATE_KEY        — приватная часть ИЗОЛИРОВАННОГО деплой-ключа проекта (#001)
#   secrets.DEPLOY_SSH_HOST        — хостнейм бокса (хостер ротирует — правится в секрете, не в файле)
#   secrets.DEPLOY_SSH_USER        — пользователь на боксе
#   secrets.DEPLOY_SSH_KNOWN_HOSTS — строка known_hosts «[host]:port ssh-ed25519 …» (снята
#                                    с доверенной машины; без ssh-keyscan ключ хоста не принимается вслепую)
#   vars.DEPLOY_SSH_PORT           — внешний порт (G8: внешний ≠ внутренний 22). Осознанно в vars:
#                                    маскировщик замазывает каждое вхождение значения, короткое число
#                                    испортило бы весь лог (#265)
#   vars.NEXT_PUBLIC_SERVER_URL    — боевой домен, строго punycode (G133/G134):
#                                    https://xn--80aaa0andu6a3j.xn--80adkdyec4j.xn--p1ai
#   secrets.SECRETS_VAULT_URL      — база API КАРМАНа (…/api/secrets). В secrets, а не в
#                                    vars: это адрес бокса, то есть recon-поле (D-038)
#   secrets.INGEST_GATEWAY_KEY     — ключ нашего приёмника /api/ingest/posts; зеркалится
#   secrets.INGEST_PUBLISH_KEY     — ключ публикации; зеркалится, но НЕ grant'ится наружу

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'mailbox/**'
      - 'design/**'
      - '**.md'
      - '.github/**'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read
  # Паспортный путь ADR-0012 (D-061): шаг предъявляет КАРМАНу подписанное
  # удостоверение прогона и получает сессионный токен своей комнаты сам.
  # Без этого права ACTIONS_ID_TOKEN_REQUEST_* в шаге не появятся вовсе.
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kazanskaya_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # Предохранитель миграций (#017): Payload-миграции применяет разработчик
      # вручную на проде ДО деплоя; CI лишь проверяет, что в коммите нет
      # неприменённых. workflow_dispatch = «уже применил» → guard пропускается.
      - name: Migration guard
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -e
          NEW=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'web/src/migrations/*.ts' | grep -v '/index\.ts$' || true)
          if [ -n "$NEW" ]; then
            echo "::error::Коммит вносит новые Payload-миграции. Примени их на проде вручную, затем запусти деплой через workflow_dispatch."
            echo "$NEW"
            exit 1
          fi
          echo "Новых Payload-миграций в коммите нет — деплой продолжается."

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable corepack + pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Generate importmap + types
        working-directory: web
        run: |
          pnpm generate:importmap
          pnpm generate:types

      - name: Build (standalone)
        working-directory: web
        env:
          # Эфемерная БД CI: push:true создаёт схему здесь, prerender отдаёт
          # статические страницы — рантайм наполнит через ISR/ревалидацию.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kazanskaya_build
          PAYLOAD_SECRET: ci-build-only-secret-not-used-at-runtime
          NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL || 'http://127.0.0.1:3001' }}
          # Метрика инлайнится в пререндер на этапе build (id не секрет — виден в HTML).
          NEXT_PUBLIC_YM_ID: ${{ vars.NEXT_PUBLIC_YM_ID }}
          STANDALONE_BUILD: '1'
        run: pnpm build

      - name: Assemble standalone bundle
        working-directory: web
        run: |
          set -e
          if [ ! -f .next/standalone/server.js ]; then
            echo "::error::server.js не в корне .next/standalone — проверь outputFileTracingRoot"
            find .next/standalone -maxdepth 3 -name server.js || true
            exit 1
          fi
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          tar czf ../kazanskaya-app.tgz -C .next/standalone .
          echo "bundle: $(du -h ../kazanskaya-app.tgz | cut -f1)"

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          set -e
          for v in SSH_PRIVATE_KEY DEPLOY_SSH_HOST DEPLOY_SSH_USER DEPLOY_SSH_KNOWN_HOSTS DEPLOY_SSH_PORT; do
            if [ -z "${!v}" ]; then
              echo "::error::Не задано: $v (secrets.SSH_PRIVATE_KEY / DEPLOY_SSH_HOST / DEPLOY_SSH_USER / DEPLOY_SSH_KNOWN_HOSTS, vars.DEPLOY_SSH_PORT)"
              exit 1
            fi
          done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_kazanskaya
          chmod 600 ~/.ssh/id_ed25519_kazanskaya
          # Ключ хоста — фиксированная запись из секрета, проверка строгая: подмена
          # сервера роняет шаг, а не проходит через accept-new/keyscan.
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          {
            echo "Host kazanskaya"
            echo "  HostName $DEPLOY_SSH_HOST"
            echo "  Port $DEPLOY_SSH_PORT"
            echo "  User $DEPLOY_SSH_USER"
            echo "  IdentityFile ~/.ssh/id_ed25519_kazanskaya"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Ship artifact + restart
        run: |
          set -e
          scp -q kazanskaya-app.tgz kazanskaya:/tmp/kazanskaya-app.tgz
          ssh kazanskaya 'bash -s' "${{ github.sha }}" <<'REMOTE'
          set -e
          SHA="$1"
          BASE="$HOME/kazanskaya"
          REL="$BASE/releases/$SHA"
          rm -rf "$REL"; mkdir -p "$REL"
          tar xzf /tmp/kazanskaya-app.tgz -C "$REL"
          rm -f /tmp/kazanskaya-app.tgz
          # Персистентное медиа (G146): public/media в релизе → симлинк на shared/media,
          # переживающий деплои.
          # public/ может отсутствовать в артефакте (пока в репо нет web/public) — создаём.
          mkdir -p "$BASE/shared/media" "$REL/public"
          rm -rf "$REL/public/media"
          ln -sfn "$BASE/shared/media" "$REL/public/media"
          ln -sfn "$REL" "$BASE/current"
          sudo systemctl restart kazanskaya
          # держим последние 5 релизов
          ls -1dt "$BASE"/releases/*/ 2>/dev/null | tail -n +6 | xargs -r rm -rf
          echo "deployed $SHA"
          REMOTE

      # #011 content-smoke: не только 200, но и контент-маркер.
      # Ревизия гейтов (#104, 2026-07-30): маркер главной «Ярмарка Казанская» —
      # статический <h1>, он на месте даже при полностью пустой БД. Поэтому
      # добавлены маркеры страниц, чей контент приходит из прод-БД: они краснеют,
      # если база недоступна, пуста или страница снова начала отдавать пререндер
      # сборочной базы (G203).
      - name: Smoke check — routes (/, /program, /map, /admin) + content from DB
        run: |
          set -e
          ssh kazanskaya 'bash -s' <<'REMOTE'
          set -e
          sleep 6   # дать сервису подняться после systemctl restart
          fail=0
          check() {
            path="$1"; expected="$2"
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "http://127.0.0.1:3001$path" || true)
            echo "local $path → $status (ожидалось: $expected)"
            case " $expected " in
              *" $status "*) ;;
              *) echo "::error::local $path = $status, ожидалось одно из: $expected"; fail=1 ;;
            esac
          }
          # present <path> <подстрока в HTML> <что это значит> — маркер обязан быть
          present() {
            if curl -s --max-time 15 "http://127.0.0.1:3001$1" | grep -q -- "$2"; then
              echo "content marker OK: $1 — $3"
            else
              echo "::error::$1: маркер «$3» не найден (искали: $2)"
              fail=1
            fi
          }
          # absent <path> <подстрока> <что это значит> — маркера быть не должно
          absent() {
            if curl -s --max-time 15 "http://127.0.0.1:3001$1" | grep -q -- "$2"; then
              echo "::error::$1: страница отдаёт заглушку «$3» — данных из БД нет"
              fail=1
            else
              echo "content marker OK: $1 — заглушки «$3» нет"
            fi
          }
          check "/"        "200"
          check "/program" "200"
          check "/map"     "200"
          check "/admin"   "200 302 307 308"
          present "/"        "Ярмарка Казанская" "название праздника на главной"
          # event__content рендерится только когда список событий непуст, то есть
          # когда афиша реально прочитана из прод-БД.
          present "/program" "event__content" "события афиши из БД"
          # Обратная сторона той же проверки: ветку-заглушку рендерит только пустой
          # результат запроса к базе — она же попадала в пререндер сборки (G203).
          absent "/program" "по часам временно недоступно"     "расписание недоступно"
          absent "/map"     "по площадкам временно недоступно" "площадки недоступны"
          exit $fail
          REMOTE

      # Зеркало секретов в свою комнату КАРМАНа + выдача grant'а Сарафану.
      # ADR-0006 (обязанность зеркалить) + ADR-0012 (паспорт) + D-061 (маршрут
      # ключа приёмника без рук владельца; письма brain 02.09 и 03.09).
      #
      # Токен комнаты не хранится НИГДЕ: шаг предъявляет КАРМАНу OIDC-удостоверение
      # прогона и получает сессионный токен на 60 минут. Три условия КАРМАНа:
      # audience ровно `karman-vault`, прогон с refs/heads/main, самоотзыв сессии.
      #
      # ⚠️ На PR-прогоне удостоверение приходит с `ref:refs/pull/…`, subject_pattern
      # его не пропускает — это 401 ПО ПОСТРОЕНИЮ, а не дефект (письмо КАРМАНа
      # через brain 03.09, passport_identity id 4). Поэтому шаг не блокирующий, а
      # приёмка возможна только по прогону из main после мержа.
      #
      # ⚠️ Токен приходит ОТВЕТОМ, а не из `secrets` — автоматической маскировки
      # для него не существует, `::add-mask::` ставим руками до первого использования.
      # ⚠️ trap … EXIT ровно ОДИН: второй молча заменил бы первый и самоотзыв
      # сессии исчез бы. Уборка временных файлов входит в тот же единственный trap.
      - name: Зеркало секретов в комнату КАРМАНа + grant → setka
        if: success()
        continue-on-error: true
        env:
          VAULT: ${{ secrets.SECRETS_VAULT_URL }}
          INGEST_GATEWAY_KEY: ${{ secrets.INGEST_GATEWAY_KEY }}
          INGEST_PUBLISH_KEY: ${{ secrets.INGEST_PUBLISH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${VAULT:-}" ]; then
            echo "::warning::secrets.SECRETS_VAULT_URL не задан — зеркалирование пропущено"
            exit 0
          fi
          if [ -z "${INGEST_GATEWAY_KEY:-}" ]; then
            echo "::warning::secrets.INGEST_GATEWAY_KEY не задан — зеркалировать нечего"
            exit 0
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::warning::OIDC недоступен (нужно permissions: id-token: write) — зеркалирование пропущено"
            exit 0
          fi

          # 1. Удостоверение прогона. audience — РОВНО эта строка, иначе 401 без пояснений.
          ASSERTION="$(curl -sf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=karman-vault" | jq -r '.value // empty')"
          if [ -z "$ASSERTION" ]; then
            echo "::warning::удостоверение прогона не выдано — зеркалирование пропущено"
            exit 0
          fi
          echo "::add-mask::$ASSERTION"

          # 2. Обмен удостоверения на сессионный токен комнаты (TTL 60 мин).
          #    Постоянного secrets.SECRETS_TOKEN нет и быть не должно: положить туда
          #    сессионный токен = положить значение, которое протухнет через час,
          #    оставаясь на вид рабочим.
          SESSION="$(curl -sf -X POST "$VAULT/session" -H "Authorization: Bearer $ASSERTION" || true)"
          TOKEN="$(printf '%s' "$SESSION" | jq -r '.token // empty' 2>/dev/null || true)"
          if [ -z "$TOKEN" ]; then
            echo "::warning::сессия не открыта (на PR-прогоне это 401 по построению) — шаг пропущен"
            exit 0
          fi
          echo "::add-mask::$TOKEN"
          trap 'curl -sf -X DELETE "$VAULT/session" -H "Authorization: Bearer $TOKEN" >/dev/null 2>&1 || true; rm -f /tmp/vault-mirror.json /tmp/vault-grant.json /tmp/vault-grants.json /tmp/vault-grant-out.txt' EXIT
          echo "сессия открыта: 201"

          if [ "$(printf '%s' "$SESSION" | jq -r '.canWrite // false')" != "true" ]; then
            echo "::warning::сессия без права записи — зеркалирование пропущено"
            exit 0
          fi

          # 3. Значения — в комнату. Через --arg, не подстановкой в строку JSON:
          #    спецсимволы в секретах не ломают документ и не утекают в лог.
          #    INGEST_PUBLISH_KEY зеркалим (ADR-0006), но наружу не отдаём — см. п.4.
          jq -n \
            --arg gw "$INGEST_GATEWAY_KEY" \
            --arg pub "${INGEST_PUBLISH_KEY:-}" \
            '{secrets: ({INGEST_GATEWAY_KEY:$gw} + (if $pub == "" then {} else {INGEST_PUBLISH_KEY:$pub} end))}' \
            > /tmp/vault-mirror.json
          curl -sf -X POST "$VAULT" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data @/tmp/vault-mirror.json > /dev/null
          echo "значение INGEST_GATEWAY_KEY в комнате kazanskayamalmyzh"

          # 4. Grant kazanskayamalmyzh → setka на ОДИН ключ шлюза (письмо brain 03.09).
          #    INGEST_PUBLISH_KEY не grant'им никогда: draft остаётся по построению (#124).
          #    Идемпотентность на нашей стороне — повторный прогон не выдаёт второй grant.
          GCODE="$(curl -s -o /tmp/vault-grants.json -w '%{http_code}' "$VAULT/grants" -H "Authorization: Bearer $TOKEN" || true)"
          echo "GET /grants: $GCODE"
          GRANTS="$(cat /tmp/vault-grants.json 2>/dev/null || true)"
          HAVE="$(printf '%s' "$GRANTS" | jq -r '
            (if type == "array" then . else (.grants // .items // .data // []) end)
            | map(select(((.key // .secret_key // "") == "INGEST_GATEWAY_KEY")
                     and ((.target_slug // .target // .to // "") == "setka")))
            | length' 2>/dev/null || echo 0)"
          if [ "${HAVE:-0}" != "0" ]; then
            echo "grant → setka уже выдан ранее — повторно не выдаём"
            exit 0
          fi

          # note обязателен валидацией: он попадает в аудит обеих комнат
          # (grant_out/grant_in) как основание выдачи.
          jq -n '{key:"INGEST_GATEWAY_KEY", target_slug:"setka",
                  alias:"KAZANSKAYA_INGEST_KEY", note:"D-015/D-061, brain 2026-09-02"}' \
            > /tmp/vault-grant.json
          CODE="$(curl -s -o /tmp/vault-grant-out.txt -w '%{http_code}' -X POST "$VAULT/grants" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data @/tmp/vault-grant.json)"
          case "$CODE" in
            200|201) echo "grant → setka: $CODE (alias KAZANSKAYA_INGEST_KEY)" ;;
            409)     echo "grant → setka: 409, уже существует — идемпотентно" ;;
            *)       echo "::warning::grant → setka не выдан: HTTP $CODE"
                     # Тело ответа — сообщение КАРМАНа об отказе, секретов в нём нет.
                     # Без него 403 неотличим от «нет права» / «нет такой комнаты» /
                     # «поле названо иначе» (#110: «отправлено ≠ доставлено»).
                     echo "ответ КАРМАНа: $(head -c 500 /tmp/vault-grant-out.txt 2>/dev/null)"
                     exit 0 ;;
          esac

      # Диагностика при падении — урезанная, не дамп (#265, G290): systemctl status
      # печатает путь юнита и хвост журнала с хостнеймом в каждой строке, а
      # маскировка secrets ловит только точное значение целиком — короткий
      # хостнейм, /home/<user> и user:pass@host внутри URL ошибки БД утекают.
      # Поэтому: именованные поля юнита + журнал без префиксов + редакция
      # производных форм на выходе.
      - name: On failure — состояние юнита (урезанный вывод)
        if: failure()
        run: |
          ssh kazanskaya 'bash -s' <<'REMOTE' 2>&1 || true
          set +e
          H="$(hostname -s)"
          U="$(id -un)"
          redact() {
            sed -E \
              -e "s#/home/$U#/home/[user]#g" \
              -e "s#([a-z][a-z0-9+.-]*://)[^@/[:space:]]+@#\1***:***@#g" \
              -e "s#$H#[host]#g"
          }
          echo "== systemctl show kazanskaya =="
          sudo systemctl show kazanskaya -p ActiveState -p SubState -p Result -p ExecMainStatus -p NRestarts | redact
          echo "== journalctl -u kazanskaya (last 60, no prefixes) =="
          sudo journalctl -u kazanskaya -n 60 --no-pager -o cat | redact
          REMOTE
