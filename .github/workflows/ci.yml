name: CI

# Зелёные гейты PR (постулат 30: авто-мерж на зелёных): секреты, lint, CSS,
# typecheck, тесты, сборка против эфемерной БД — та же схема, что у прод-сборки,
# но без standalone/деплоя.
#
# Ревизия #104 (2026-07-30): каждый шаг здесь имеет показанный красный прогон,
# иначе он не считается заведённым. Правило, стоящее `warn`, гейтом не является —
# `next lint` падает только на `error`.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kazanskaya_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          # Полная история: gitleaks проверяет и удалённые в последующих коммитах
          # секреты, а не только текущее состояние файлов. Репо маленькое (~64
          # коммита) — цена этого несколько секунд.
          fetch-depth: 0

      # Секреты в репо запрещены (#008: боевые значения живут в
      # /etc/kazanskaya/kazanskaya.env, в git — только .env.example). До сих пор
      # это держалось дисциплиной; теперь проверяется.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -e
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable corepack + pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Generate importmap + types
        working-directory: web
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kazanskaya_build
          PAYLOAD_SECRET: ci-build-only-secret-not-used-at-runtime
        run: |
          pnpm generate:importmap
          pnpm generate:types

      - name: Lint
        working-directory: web
        run: pnpm lint

      # CSS-темы две и обе крупные; stylelint взят в конфигурации
      # `recommended` — только возможные ошибки (неизвестное свойство, пустой
      # блок, битый синтаксис), без стилистики: шумные правила про rgba/hex
      # завалили бы гейт сотней замечаний и он превратился бы в фон.
      - name: Lint CSS
        working-directory: web
        run: pnpm lint:css

      - name: Typecheck
        working-directory: web
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kazanskaya_build
          PAYLOAD_SECRET: ci-build-only-secret-not-used-at-runtime
        run: pnpm typecheck

      # Тесты на чистую логику: JSON-LD праздника и летопись годов. Оба набора
      # написаны вокруг уже случавшихся багов — расхождение статуса праздника и
      # его subEvent и сбитый порядок годов.
      - name: Test
        working-directory: web
        run: pnpm test

      - name: Build
        working-directory: web
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kazanskaya_build
          PAYLOAD_SECRET: ci-build-only-secret-not-used-at-runtime
          NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:3001
        run: pnpm build
